# RedHat Based
- name: Install Microsoft GPG Key (RPM Based)
  ansible.builtin.rpm_key:
    state: present
    key: https://packages.microsoft.com/keys/microsoft.asc
  become: true
  become_user: root
  when: ansible_distribution == "CentOS" or ansible_distribution == "RedHat"

- name: Install Microsoft Repo
  ansible.builtin.yum:
    name: https://packages.microsoft.com/config/rhel/9.0/packages-microsoft-prod.rpm
    state: present
  become: true
  become_user: root
  when: ansible_distribution == "CentOS" or ansible_distribution == "RedHat"

# Debian Based
- name: Install Microsoft GPG Key (Debian Based)
  ansible.builtin.apt_key:
    state: present
    url: https://packages.microsoft.com/keys/microsoft.asc
  become: true
  become_user: root
  when: ansible_facts['os_family'] == "Debian"

- name: Install Microsoft Repo
  ansible.builtin.apt_repository:
    filename: microsoft
    repo: "deb [arch=amd64,arm64,armhf] https://packages.microsoft.com/repos/azure-cli/ {{ansible_distribution_release}} main"
    state: present
  become: true
  become_user: root
  when: ansible_facts['os_family'] == "Debian" # and ansible_distribution == "Pop!_OS"

