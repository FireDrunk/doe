---
- name: Enable COPR
  become: true
  become_user: root

  shell:
    cmd: "dnf copr enable -y atim/starship"
  when: ansible_distribution == "CentOS" or ansible_distribution == "RedHat"

- name: Install Starship rpm package
  become: true
  become_user: root
  
  package:
    name: starship
    state: latest
  when: ansible_distribution == "CentOS" or ansible_distribution == "RedHat"

- name: Download Starship installer
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: "{{ doe_main_directory }}/starship-install.sh"
    mode: "0750"
  when: ansible_facts['os_family'] == "Debian"

- name: Install Starship snap (web installer)
  ansible.builtin.shell:
    cmd: "sh {{ doe_main_directory }}/starship-install.sh -y"
  when: ansible_facts['os_family'] == "Debian"

- name: Enable Starship in bashrc
  ansible.builtin.lineinfile:
    path: "~{{ user }}/.bashrc"
    line: "eval \"$(starship init bash)\""
    regexp: "eval \"$(starship init bash)\""

- name: Create Config directory
  ansible.builtin.file:
    state: directory
    path: "~{{ user }}/.config"

- name: Check if Starship Config exists
  ansible.builtin.stat:
    path: "~{{ user }}/.config/starship.toml"
  register: starship_config

- name: Ensure Starship Config exists
  ansible.builtin.file:
    state: touch
    path: "~{{ user }}/.config/starship.toml"
  when: not starship_config.stat.exists

- name: Ensure Starship Settings (unless exists)
  ansible.builtin.blockinfile:
    dest: "~{{ user }}/.config/starship.toml"
    content: |
      format = "$all"
      
      [kubernetes]
      disabled = false
      
      format = '[$context \(](dimmed green)[$namespace](blue)[\)](dimmed green) '
  when: not starship_config.stat.exists
